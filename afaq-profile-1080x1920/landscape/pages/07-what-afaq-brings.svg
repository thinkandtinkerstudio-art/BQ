    </g>
    <text id="Item-Title-5" x="160" y="748.46" font-family="Inter" font-size="26" font-weight="600" fill="#F5F4EB">Delivery team</text>
    <g id="Item-Body-5">
      <text id="Item-Body-line-3" x="160" y="781.05" font-family="Inter" font-size="18" font-weight="400" fill="#F5F4EB" opacity="0.8">An engineering team for design and supervision, and a field crew for installation and</text>
      <text id="Item-Body-line-4" x="160" y="808.05" font-family="Inter" font-size="18" font-weight="400" fill="#F5F4EB" opacity="0.8">commissioning.</text>
