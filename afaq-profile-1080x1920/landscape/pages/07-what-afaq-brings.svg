    </g>
    <text id="Item-Title" x="160" y="329.46" font-family="Inter" font-size="26" font-weight="600" fill="#F5F4EB">Supply from a factory in Oman</text>
    <text id="Item-Body" x="160" y="362.05" font-family="Inter" font-size="18" font-weight="400" fill="#F5F4EB" opacity="0.8">AACE modules are manufactured in Oman, which shortens supply time compared with importing.</text>
    <path id="Divider" d="M 96 385 L 1076 385" fill="none" stroke="#F5F4EB" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" opacity="0.15"/>
  </g>
  <g id="Item-02">
