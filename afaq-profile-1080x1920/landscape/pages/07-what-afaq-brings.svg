    </g>
    <text id="Item-Title-2" x="160" y="427.46" font-family="Inter" font-size="26" font-weight="600" fill="#F5F4EB">Warranty handled inside Oman</text>
    <text id="Item-Body-2" x="160" y="460.05" font-family="Inter" font-size="18" font-weight="400" fill="#F5F4EB" opacity="0.8">AFAQ processes module warranty claims locally, without sending them to a manufacturer abroad.</text>
    <path id="Divider-2" d="M 96 483 L 1076 483" fill="none" stroke="#F5F4EB" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" opacity="0.15"/>
  </g>
  <g id="Item-03">
