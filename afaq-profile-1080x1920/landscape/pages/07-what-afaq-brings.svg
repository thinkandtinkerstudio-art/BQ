    </g>
    <text id="Item-Title-3" x="160" y="525.46" font-family="Inter" font-size="26" font-weight="600" fill="#F5F4EB">In-country value</text>
    <text id="Item-Body-3" x="160" y="558.05" font-family="Inter" font-size="18" font-weight="400" fill="#F5F4EB" opacity="0.8">Modules made in Oman support local content requirements in tenders and government projects.</text>
    <path id="Divider-3" d="M 96 581 L 1076 581" fill="none" stroke="#F5F4EB" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" opacity="0.15"/>
  </g>
