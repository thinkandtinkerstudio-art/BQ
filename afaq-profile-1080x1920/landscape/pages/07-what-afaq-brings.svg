    </g>
    <text id="Item-Title-4" x="160" y="623.46" font-family="Inter" font-size="26" font-weight="600" fill="#F5F4EB">Direct supply agreements</text>
    <g id="Item-Body-4">
      <text id="Item-Body-line" x="160" y="656.05" font-family="Inter" font-size="18" font-weight="400" fill="#F5F4EB" opacity="0.8">Written agreements with module, battery and inverter suppliers, covering availability and</text>
      <text id="Item-Body-line-2" x="160" y="683.05" font-family="Inter" font-size="18" font-weight="400" fill="#F5F4EB" opacity="0.8">manufacturer warranties.</text>
