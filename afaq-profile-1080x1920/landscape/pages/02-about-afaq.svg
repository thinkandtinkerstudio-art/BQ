    <text id="Eyebrow" x="1827.08" y="85.09" font-family="Inter" font-size="14" font-weight="500" fill="#F5F4EB" letter-spacing="3.08" text-anchor="end" opacity="0.85">CORPORATE PROFILE 2026</text>
