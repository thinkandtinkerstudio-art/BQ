  <text id="Title" x="96" y="248.28" font-family="Inter" font-size="64" font-weight="300" fill="#F5F4EB" letter-spacing="-1.28">About AFAQ</text>
  <rect id="Accent-Rule" x="96" y="278" width="72" height="6" rx="3" fill="#C8FB5F"/>
  <g id="Body-1">
    <text id="Body-1-line" x="96" y="345.87" font-family="Inter" font-size="23" font-weight="400" fill="#F5F4EB" opacity="0.9">AFAQ for Energy &amp; Integrated Business is an Omani company based in</text>
    <text id="Body-1-line-2" x="96" y="380.87" font-family="Inter" font-size="23" font-weight="400" fill="#F5F4EB" opacity="0.9">Muscat. It works in solar power, energy storage and the electrical systems</text>
    <text id="Body-1-line-3" x="96" y="415.87" font-family="Inter" font-size="23" font-weight="400" fill="#F5F4EB" opacity="0.9">that go with them.</text>
  </g>
  <g id="Body-2">
    <text id="Body-2-line" x="96" y="472.87" font-family="Inter" font-size="23" font-weight="400" fill="#F5F4EB" opacity="0.9">The company designs photovoltaic systems, supplies their components,</text>
    <text id="Body-2-line-2" x="96" y="507.87" font-family="Inter" font-size="23" font-weight="400" fill="#F5F4EB" opacity="0.9">installs them and brings them into operation, at sizes ranging from</text>
    <text id="Body-2-line-3" x="96" y="542.87" font-family="Inter" font-size="23" font-weight="400" fill="#F5F4EB" opacity="0.9">building systems to project plants.</text>
  </g>
  <g id="Body-3">
    <text id="Body-3-line" x="96" y="599.87" font-family="Inter" font-size="23" font-weight="400" fill="#F5F4EB" opacity="0.9">AFAQ works directly with facility owners, and with contractors and</text>
    <text id="Body-3-line-2" x="96" y="634.87" font-family="Inter" font-size="23" font-weight="400" fill="#F5F4EB" opacity="0.9">developers inside their own projects.</text>
  </g>
