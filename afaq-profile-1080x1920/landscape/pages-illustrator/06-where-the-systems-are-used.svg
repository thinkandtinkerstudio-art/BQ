  <text id="Title" x="96" y="248.28" font-family="Inter-Light" font-size="64" font-weight="300" fill="#053C45" letter-spacing="-1.28">Where the systems are used</text>
  <text id="Subtitle" x="96" y="300" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#5A7175">The pattern of consumption shapes the system more than the type of business does.</text>
  <g id="Card-1">
    <rect id="Card-Shape" x="96" y="352" width="414" height="460" rx="24" fill="#FFFFFF"/>
    <circle id="Icon-Disc" cx="164" cy="420" r="36" fill="#C8FB5F"/>
