    </g>
    <text id="Card-Title-2" x="566" y="499" font-family="Inter-SemiBold" font-size="22" font-weight="600" fill="#053C45">Sites with continuous loads</text>
    <g id="Card-Body-2">
      <text id="Card-Body-line-4" x="566" y="567.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">Hospitals, cold stores, production lines</text>
      <text id="Card-Body-line-5" x="566" y="593.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">and data centres. The system works</text>
      <text id="Card-Body-line-6" x="566" y="619.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">alongside the backup already in place,</text>
      <text id="Card-Body-line-7" x="566" y="645.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">cutting generator running hours and fuel</text>
      <text id="Card-Body-line-8" x="566" y="671.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">use.</text>
    </g>
  </g>
