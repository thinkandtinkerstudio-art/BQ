    <g id="Card-Title">
      <text id="Card-Title-line" x="128" y="499" font-family="Inter-SemiBold" font-size="22" font-weight="600" fill="#053C45">Sites that consume</text>
      <text id="Card-Title-line-2" x="128" y="529" font-family="Inter-SemiBold" font-size="22" font-weight="600" fill="#053C45">during the day</text>
    </g>
    <g id="Card-Body">
      <text id="Card-Body-line" x="128" y="567.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">Offices, retail centres, hotels, factories,</text>
      <text id="Card-Body-line-2" x="128" y="593.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">schools and residential compounds. Their</text>
      <text id="Card-Body-line-3" x="128" y="619.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">heaviest load falls within sunlight hours.</text>
    </g>
  </g>
  <g id="Card-2">
    <rect id="Card-Shape-2" x="534" y="352" width="414" height="460" rx="24" fill="#FFFFFF"/>
