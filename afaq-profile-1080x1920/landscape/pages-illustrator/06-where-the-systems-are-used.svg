    <text id="Card-Title-3" x="1004" y="499" font-family="Inter-SemiBold" font-size="22" font-weight="600" fill="#053C45">Sites away from the grid</text>
    <g id="Card-Body-3">
      <text id="Card-Body-line-9" x="1004" y="567.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">Farms, irrigation pumps, camps and work</text>
      <text id="Card-Body-line-10" x="1004" y="593.18" font-family="Inter-Regular" font-size="17" font-weight="400" fill="#5A7175">sites that run on diesel.</text>
    </g>
