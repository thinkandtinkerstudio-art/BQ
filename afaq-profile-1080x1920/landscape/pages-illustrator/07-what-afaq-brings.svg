    <text id="Item-Title-3" x="1080" y="471.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#F5F4EB">In-country value</text>
    <g id="Item-Body-3">
      <text id="Item-Body-line-5" x="1400" y="467.73" font-family="Inter-Regular" font-size="13" font-weight="400" fill="#F5F4EB" opacity="0.7">Modules made in Oman support local content requirements in tenders</text>
      <text id="Item-Body-line-6" x="1400" y="487.73" font-family="Inter-Regular" font-size="13" font-weight="400" fill="#F5F4EB" opacity="0.7">and government projects.</text>
