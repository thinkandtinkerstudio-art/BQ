    <g id="Item-Title">
      <text id="Item-Title-line" x="1080" y="131.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#F5F4EB">Supply from a factory in</text>
      <text id="Item-Title-line-2" x="1080" y="158.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#F5F4EB">Oman</text>
    </g>
    <g id="Item-Body">
      <text id="Item-Body-line" x="1400" y="127.73" font-family="Inter-Regular" font-size="13" font-weight="400" fill="#F5F4EB" opacity="0.7">AACE modules are manufactured in Oman, which shortens supply</text>
      <text id="Item-Body-line-2" x="1400" y="147.73" font-family="Inter-Regular" font-size="13" font-weight="400" fill="#F5F4EB" opacity="0.7">time compared with importing.</text>
