    <g id="Item-Title-2">
      <text id="Item-Title-line-3" x="1080" y="301.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#F5F4EB">Warranty handled inside</text>
      <text id="Item-Title-line-4" x="1080" y="328.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#F5F4EB">Oman</text>
    </g>
    <g id="Item-Body-2">
      <text id="Item-Body-line-3" x="1400" y="297.73" font-family="Inter-Regular" font-size="13" font-weight="400" fill="#F5F4EB" opacity="0.7">AFAQ processes module warranty claims locally, without sending</text>
      <text id="Item-Body-line-4" x="1400" y="317.73" font-family="Inter-Regular" font-size="13" font-weight="400" fill="#F5F4EB" opacity="0.7">them to a manufacturer abroad.</text>
