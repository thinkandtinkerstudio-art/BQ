      <text id="Item-Body-line-3" x="500" y="1366.59" font-family="Inter-Regular" font-size="14" font-weight="400" fill="#F5F4EB" opacity="0.7">AFAQ processes module warranty claims locally, without sending them to</text>
      <text id="Item-Body-line-4" x="500" y="1387.59" font-family="Inter-Regular" font-size="14" font-weight="400" fill="#F5F4EB" opacity="0.7">a manufacturer abroad.</text>
