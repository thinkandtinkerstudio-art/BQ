  <text id="Title" x="72" y="369.65" font-family="Inter-Light" font-size="76" font-weight="300" fill="#F5F4EB" letter-spacing="-1.52">What AFAQ brings</text>
  <g id="Item-01">
    <text id="Number" x="72" y="476.28" font-family="Inter-SemiBold" font-size="20" font-weight="600" fill="#C8FB5F">01</text>
    <g id="Icon">
      <path id="Icon-factory-1" d="M 968.58 489.42 L 968.58 471.08 L 977.75 476.58 L 977.75 471.08 L 986.92 476.58 L 986.92 471.08 L 996.08 476.58 L 996.08 458.25 L 1003.42 458.25 L 1003.42 489.42 Z" fill="none" stroke="#C8FB5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="Icon-factory-2" d="M 975 483 L 978.67 483 M 984.17 483 L 987.83 483 M 993.33 483 L 997 483" fill="none" stroke="#C8FB5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text id="Item-Title" x="156" y="479.64" font-family="Inter-SemiBold" font-size="32" font-weight="600" fill="#F5F4EB">Supply from a factory in Oman</text>
    <g id="Item-Body">
      <text id="Item-Body-line" x="156" y="520" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">AACE modules are manufactured in Oman, which shortens supply time</text>
      <text id="Item-Body-line-2" x="156" y="552" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">compared with importing.</text>
    </g>
    <path id="Divider" d="M 72 586 L 1008 586" fill="none" stroke="#F5F4EB" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" opacity="0.15"/>
  </g>
  <g id="Item-02">
    <text id="Number-2" x="72" y="641.28" font-family="Inter-SemiBold" font-size="20" font-weight="600" fill="#C8FB5F">02</text>
    <g id="Icon-2">
      <path id="Icon-shield-1" d="M 986 619.58 L 1000.67 625.08 L 1000.67 636.08 C 1000.67 645.25 994.25 651.67 986 654.42 C 977.75 651.67 971.33 645.25 971.33 636.08 L 971.33 625.08 Z" fill="none" stroke="#C8FB5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="Icon-shield-2" d="M 979.58 637 L 984.17 641.58 L 992.42 632.42" fill="none" stroke="#C8FB5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text id="Item-Title-2" x="156" y="644.64" font-family="Inter-SemiBold" font-size="32" font-weight="600" fill="#F5F4EB">Warranty handled inside Oman</text>
    <g id="Item-Body-2">
      <text id="Item-Body-line-3" x="156" y="685" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">AFAQ processes module warranty claims locally, without sending them</text>
      <text id="Item-Body-line-4" x="156" y="717" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">to a manufacturer abroad.</text>
    </g>
    <path id="Divider-2" d="M 72 751 L 1008 751" fill="none" stroke="#F5F4EB" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" opacity="0.15"/>
  </g>
  <g id="Item-03">
    <text id="Number-3" x="72" y="806.28" font-family="Inter-SemiBold" font-size="20" font-weight="600" fill="#C8FB5F">03</text>
    <g id="Icon-3">
      <path id="Icon-badge-1" d="M 996.08 796.5 C 996.08 802.07 991.57 806.58 986 806.58 C 980.43 806.58 975.92 802.07 975.92 796.5 C 975.92 790.93 980.43 786.42 986 786.42 C 991.57 786.42 996.08 790.93 996.08 796.5 Z" fill="none" stroke="#C8FB5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
