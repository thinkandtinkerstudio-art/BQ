    <g id="Item-Title">
      <text id="Item-Title-line" x="124" y="1263.37" font-family="Inter-Regular" font-size="23" font-weight="400" fill="#F5F4EB">Supply from a factory in</text>
      <text id="Item-Title-line-2" x="124" y="1293.37" font-family="Inter-Regular" font-size="23" font-weight="400" fill="#F5F4EB">Oman</text>
