    <g id="Item-Body">
      <text id="Item-Body-line" x="500" y="1259.59" font-family="Inter-Regular" font-size="14" font-weight="400" fill="#F5F4EB" opacity="0.7">AACE modules are manufactured in Oman, which shortens supply time</text>
      <text id="Item-Body-line-2" x="500" y="1280.59" font-family="Inter-Regular" font-size="14" font-weight="400" fill="#F5F4EB" opacity="0.7">compared with importing.</text>
