    <text id="Item-Title-4" x="156" y="974.64" font-family="Inter-SemiBold" font-size="32" font-weight="600" fill="#F5F4EB">Direct supply agreements</text>
    <g id="Item-Body-4">
      <text id="Item-Body-line-7" x="156" y="1015" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">Written agreements with module, battery and inverter suppliers,</text>
      <text id="Item-Body-line-8" x="156" y="1047" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">covering availability and manufacturer warranties.</text>
    </g>
