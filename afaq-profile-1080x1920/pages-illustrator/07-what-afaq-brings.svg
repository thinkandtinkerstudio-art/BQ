    </g>
    <text id="Item-Title-3" x="156" y="809.64" font-family="Inter-SemiBold" font-size="32" font-weight="600" fill="#F5F4EB">In-country value</text>
    <g id="Item-Body-3">
      <text id="Item-Body-line-5" x="156" y="850" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">Modules made in Oman support local content requirements in tenders</text>
      <text id="Item-Body-line-6" x="156" y="882" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">and government projects.</text>
    </g>
    <path id="Divider-3" d="M 72 916 L 1008 916" fill="none" stroke="#F5F4EB" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" opacity="0.15"/>
  </g>
  <g id="Item-04">
    <text id="Number-4" x="72" y="971.28" font-family="Inter-SemiBold" font-size="20" font-weight="600" fill="#C8FB5F">04</text>
