    </g>
    <text id="Item-Title-5" x="156" y="1139.64" font-family="Inter-SemiBold" font-size="32" font-weight="600" fill="#F5F4EB">Delivery team</text>
    <g id="Item-Body-5">
      <text id="Item-Body-line-9" x="156" y="1180" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">An engineering team for design and supervision, and a field crew for</text>
      <text id="Item-Body-line-10" x="156" y="1212" font-family="Inter-Regular" font-size="22" font-weight="400" fill="#F5F4EB" opacity="0.8">installation and commissioning.</text>
    </g>
