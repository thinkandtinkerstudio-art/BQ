    <g id="Card-Body-2">
      <text id="Card-Body-line-5" x="595" y="885.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#5A7175">Hospitals, cold stores, production</text>
      <text id="Card-Body-line-6" x="595" y="916.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#5A7175">lines and data centres. The system</text>
      <text id="Card-Body-line-7" x="595" y="947.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#5A7175">works alongside the backup already</text>
      <text id="Card-Body-line-8" x="595" y="978.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#5A7175">in place, cutting generator running</text>
      <text id="Card-Body-line-9" x="595" y="1009.14" font-family="Inter-Regular" font-size="21" font-weight="400" fill="#5A7175">hours and fuel use.</text>
