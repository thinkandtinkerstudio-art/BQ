  <text id="Title" x="72" y="369.65" font-family="Inter" font-size="76" font-weight="300" fill="#F5F4EB" letter-spacing="-1.52">About AFAQ</text>
  <rect id="Accent-Rule" x="72" y="406" width="80" height="6" rx="3" fill="#C8FB5F"/>
  <g id="Body-1">
    <text id="Body-1-line" x="72" y="485.46" font-family="Inter" font-size="26" font-weight="400" fill="#F5F4EB" opacity="0.9">AFAQ for Energy &amp; Integrated Business is an Omani company based in</text>
    <text id="Body-1-line-2" x="72" y="525.46" font-family="Inter" font-size="26" font-weight="400" fill="#F5F4EB" opacity="0.9">Muscat. It works in solar power, energy storage and the electrical systems</text>
    <text id="Body-1-line-3" x="72" y="565.46" font-family="Inter" font-size="26" font-weight="400" fill="#F5F4EB" opacity="0.9">that go with them.</text>
  </g>
  <g id="Body-2">
    <text id="Body-2-line" x="72" y="631.46" font-family="Inter" font-size="26" font-weight="400" fill="#F5F4EB" opacity="0.9">The company designs photovoltaic systems, supplies their components,</text>
    <text id="Body-2-line-2" x="72" y="671.46" font-family="Inter" font-size="26" font-weight="400" fill="#F5F4EB" opacity="0.9">installs them and brings them into operation, at sizes ranging from building</text>
    <text id="Body-2-line-3" x="72" y="711.46" font-family="Inter" font-size="26" font-weight="400" fill="#F5F4EB" opacity="0.9">systems to project plants.</text>
  </g>
  <g id="Body-3">
    <text id="Body-3-line" x="72" y="777.46" font-family="Inter" font-size="26" font-weight="400" fill="#F5F4EB" opacity="0.9">AFAQ works directly with facility owners, and with contractors and</text>
    <text id="Body-3-line-2" x="72" y="817.46" font-family="Inter" font-size="26" font-weight="400" fill="#F5F4EB" opacity="0.9">developers inside their own projects.</text>
  </g>
