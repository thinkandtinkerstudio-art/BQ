    <text id="Card-Title-2" x="595" y="804.19" font-family="Inter" font-size="28" font-weight="600" fill="#053C45">Sites with continuous loads</text>
    <g id="Card-Body-2">
      <text id="Card-Body-line-5" x="595" y="849.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">Hospitals, cold stores, production</text>
      <text id="Card-Body-line-6" x="595" y="880.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">lines and data centres. The system</text>
      <text id="Card-Body-line-7" x="595" y="911.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">works alongside the backup already</text>
      <text id="Card-Body-line-8" x="595" y="942.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">in place, cutting generator running</text>
      <text id="Card-Body-line-9" x="595" y="973.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">hours and fuel use.</text>
    </g>
