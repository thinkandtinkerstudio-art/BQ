  </g>
  <g id="Subtitle">
    <text id="Subtitle-line" x="72" y="516.46" font-family="Inter" font-size="26" font-weight="400" fill="#5A7175">The pattern of consumption shapes the system more than the type of</text>
    <text id="Subtitle-line-2" x="72" y="554.46" font-family="Inter" font-size="26" font-weight="400" fill="#5A7175">business does.</text>
  </g>
