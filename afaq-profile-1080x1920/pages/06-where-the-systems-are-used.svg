      <text id="Card-Title-line-2" x="112" y="840.19" font-family="Inter" font-size="28" font-weight="600" fill="#053C45">the day</text>
    </g>
    <g id="Card-Body">
      <text id="Card-Body-line" x="112" y="885.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">Offices, retail centres, hotels,</text>
      <text id="Card-Body-line-2" x="112" y="916.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">factories, schools and residential</text>
      <text id="Card-Body-line-3" x="112" y="947.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">compounds. Their heaviest load falls</text>
      <text id="Card-Body-line-4" x="112" y="978.14" font-family="Inter" font-size="21" font-weight="400" fill="#5A7175">within sunlight hours.</text>
    </g>
  </g>
